name: Lumen F23 Validation

on:
  push:
    branches: ["master", "phase/f23-real-environment-validation"]
  pull_request:

jobs:
  validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: F23 environment tests
        run: python -m pytest -q tests/test_f23_environment_validation.py
