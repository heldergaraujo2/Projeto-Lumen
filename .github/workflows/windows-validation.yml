name: Lumen Windows Validation

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Tests
        run: python -m pytest -q
      # Fase 0: app/computer_control/windows_driver.py foi arquivado em
      # archive/ (código morto). O gate F27 importava esse módulo removido
      # do runtime e não realizava teste físico no runner hospedado.
      # Compile + Tests continuam validando o código vivo no Windows.
